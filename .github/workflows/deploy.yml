name: Deploy to Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  TARGET_DIR: /home/organic/dev
  SSH_USER: organic

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Create Target Directory
        run: ssh ${{ env.SSH_USER }}@${{ secrets.SERVER_IP }} "mkdir -p ${{ env.TARGET_DIR }}"

      - name: Deploy with rsync
        run: rsync -avz --delete --exclude '.git' --exclude '.github' ./ ${{ env.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ env.TARGET_DIR }}

      - name: Restart Docker Compose
        run: |
          ssh ${{ env.SSH_USER }}@${{ secrets.SERVER_IP }} "cd ${{ env.TARGET_DIR }} && docker-compose down && docker-compose up -d"
